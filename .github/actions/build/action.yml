name: Build Tacenva Desktop
description: Setup dependencies and build Tacenva Desktop

inputs:
  goos:
    description: Target operating system
    required: true
  goarch:
    description: Target architecture
    required: true
  version:
    description: Application version
    required: true

runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      if: inputs.goos == 'linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          gcc \
          xorg-dev \
          libgl1-mesa-dev \
          libegl1-mesa-dev \
          libwayland-dev \
          libxkbcommon-dev

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Build
      shell: bash
      env:
        GOOS: ${{ inputs.goos }}
        GOARCH: ${{ inputs.goarch }}
        VERSION: ${{ inputs.version }}
      run: |
        mkdir -p dist

        NAME="tacenva-${GOOS}-${GOARCH}"

        if [ "$GOOS" = "windows" ]; then
          NAME="${NAME}.exe"
        fi

        if [ "$GOOS" = "linux" ]; then
          export CGO_ENABLED=1
        fi

        LDFLAGS="-s -w -X github.com/tacenva/tacenva/internal/app.Version=${VERSION}"

        if [ "$GOOS" = "windows" ]; then
          LDFLAGS="$LDFLAGS -H=windowsgui"
        fi

        go build \
          -trimpath \
          -ldflags="$LDFLAGS" \
          -o "dist/${NAME}" \
          ./cmd/tacenva
