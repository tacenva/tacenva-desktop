name: Build Tacenva Desktop
description: Setup dependencies and build Tacenva Desktop

inputs:
  goos:
    description: Target operating system
    required: true
  goarch:
    description: Target architecture
    required: true
  version:
    description: Application version
    required: true

runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      if: inputs.goos == 'linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          gcc \
          xorg-dev \
          libgl1-mesa-dev \
          libegl1-mesa-dev \
          libwayland-dev \
          libxkbcommon-dev

    - name: Setup Windows GCC
      if: inputs.goos == 'windows' && inputs.goarch == 'amd64'
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: mingw-w64-x86_64-gcc

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Build
      shell: bash
      env:
        GOOS: ${{ inputs.goos }}
        GOARCH: ${{ inputs.goarch }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        mkdir -p dist

        NAME="tacenva-${GOOS}-${GOARCH}"

        if [ "$GOOS" = "windows" ]; then
          NAME="${NAME}.exe"
        fi

        export CGO_ENABLED=1

        if [ "$GOOS" = "windows" ]; then
          if [ "$GOARCH" != "amd64" ]; then
            echo "Unsupported Windows architecture: ${GOARCH}"
            exit 1
          fi

          export CC=gcc
          gcc --version
        fi

        APP_PKG=$(go list -f '{{.ImportPath}}' ./internal/app)

        echo "VERSION: ${VERSION}"
        echo "APP_PKG: ${APP_PKG}"

        LDFLAGS="-s -w -X ${APP_PKG}.Version=${VERSION}"

        if [ "$GOOS" = "windows" ]; then
          LDFLAGS="$LDFLAGS -H=windowsgui"
        fi

        go build \
          -trimpath \
          -ldflags="$LDFLAGS" \
          -o "dist/${NAME}" \
          ./cmd/tacenva
