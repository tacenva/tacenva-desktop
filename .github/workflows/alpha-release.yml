
name: Alpha Release

on:
  push:
    branches:
      - alpha

permissions:
  contents: write

concurrency:
  group: alpha-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Generate Alpha Version
    runs-on: ubuntu-24.04

    outputs:
      tag: ${{ steps.version.outputs.tag }}

    env:
      BASE_VERSION: "1.0.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Next Version
        id: version
        shell: bash
        run: |
          PREFIX="v${BASE_VERSION}-alpha"

          LAST_TAG=$(git tag --list "${PREFIX}.*" \
            --sort=-version:refname | head -n 1)

          if [[ -z "$LAST_TAG" ]]; then
            NEXT=1
          else
            LAST_NUMBER="${LAST_TAG##*.}"

            if [[ ! "$LAST_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "Invalid tag: $LAST_TAG"
              exit 1
            fi

            NEXT=$((LAST_NUMBER + 1))
          fi

          NEW_TAG="${PREFIX}.${NEXT}"

          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Next release: $NEW_TAG"

  test:
    name: Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            gcc \
            xorg-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Test
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: [prepare, test]
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64

          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64

          - runner: macos-15-intel
            goos: darwin
            goarch: amd64

          - runner: macos-15
            goos: darwin
            goarch: arm64

          - runner: windows-2025
            goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Binary
        uses: ./.github/actions/build
        with:
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: tacenva-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Alpha Tag & Release
    needs: [prepare, build]
    runs-on: ubuntu-24.04

    env:
      NEW_TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create Git Tag
        shell: bash
        run: |
          git fetch --force --tags

          if git ls-remote --exit-code --tags origin "refs/tags/${NEW_TAG}" >/dev/null 2>&1; then
            echo "Tag already exists: ${NEW_TAG}"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Create GitHub Pre-release
        run: |
          gh release create "$NEW_TAG" dist/* \
            --title "$NEW_TAG" \
            --generate-notes \
            --prerelease

      - name: Release Summary
        run: |
          echo "## Alpha Release Created" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** $NEW_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** alpha" >> "$GITHUB_STEP_SUMMARY"
          echo "**Type:** Pre-release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Binaries" >> "$GITHUB_STEP_SUMMARY"
          ls -1 dist/ >> "$GITHUB_STEP_SUMMARY"
