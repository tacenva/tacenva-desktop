name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64

          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64

          # macOS
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64

          - runner: macos-14
            goos: darwin
            goarch: arm64

          # Windows
          - runner: windows-2025
            goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            pkg-config \
            gcc \
            xorg-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          go test ./...

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist

          NAME="tacenva-${GOOS}-${GOARCH}"

          if [ "$GOOS" = "windows" ]; then
            NAME="${NAME}.exe"
          fi

          if [ "$GOOS" = "linux" ]; then
            export CGO_ENABLED=1
          fi

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "dist/${NAME}" \
            ./cmd/tacenva

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: tacenva-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*